                  <div style={{fontSize:13,fontWeight:700,color:"#fff",background:"#0e4a6e",padding:"7px 14px",borderRadius:6}}>{g.label} <span style={{fontWeight:400,opacity:0.8,fontSize:11}}>· no scored questions</span></div>
                </div>
              );
              // extremes
              const topFav = g.items.reduce((a,b)=>b.favRate>a.favRate?b:a, g.items[0]);
              const topCon = g.items.reduce((a,b)=>b.conRate>a.conRate?b:a, g.items[0]);
              const sorted = [...g.items].sort((a,b)=>b.conRate-a.conRate);
              return (
                <div key={g.key} style={{...s.card,padding:0,marginBottom:14,overflow:"hidden"}}>
                  <div style={{fontSize:13,fontWeight:700,color:"#fff",background:"#0e4a6e",padding:"8px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span>{g.label}</span>
                    <span style={{fontWeight:400,opacity:0.85,fontSize:11}}>{g.items.length} scored item{g.items.length===1?"":"s"}</span>
                  </div>
                  <div style={{padding:"6px 14px 10px"}}>
                    <div style={{display:"flex",gap:12,margin:"4px 0 8px",fontSize:11,flexWrap:"wrap"}}>
                      <div style={{color:"#15803d"}}>★ Strongest: <b>{topFav.favRate}%</b> favourable — {topFav.label.length>44?topFav.label.slice(0,44)+"…":topFav.label}</div>
                      <div style={{color:"#b91c1c"}}>▲ Biggest concern: <b>{topCon.conRate}%</b> — {topCon.label.length>44?topCon.label.slice(0,44)+"…":topCon.label}</div>
                    </div>
                    {sorted.map(it=>itemRow(it, it===topFav?"fav":it===topCon?"con":null))}
                  </div>
                </div>
              );
            })}
          </>
        );
      })()}

      {/* ======================= DISPARITY SCANNER ======================= */}
      {page === "scanner" && (() => {
        const rows0 = data?.questionRows;
        const catalog = data?.surveyQuestions;
        const domainLabels = data?.domainLabels || {};
        if (!rows0 || !rows0.length || !catalog) {
          return <div style={{...s.card,padding:24,textAlign:"center",color:"#94a3b8",fontSize:13}}>No question data yet. Run the pipeline to populate the scanner.</div>;
        }
        const rows = withWellbeing(rows0, catalog);

        // Lens definitions for pairing (value lists + human labels)
        const LENSES = [
          { key:"g", label:"Gender", vals:[["Male","Male"],["Female","Female"]] },
          { key:"a", label:"Age", vals:[["10-12","10-12"],["13-16","13-16"],["17","17"]] },
          { key:"i", label:"Income", vals:[["B40","B40"],["M40","M40"],["T20","T20"]] },
          { key:"u", label:"Urban/Rural", vals:[["Urban","Urban"],["Peri-urban","Peri-urban"],["Rural","Rural"]] },
          { key:"d", label:"Disability", vals:[["Disabled","1"],["Not disabled","0"]] },
          { key:"m", label:"Migration", vals:[["Migrant/refugee","1"],["Citizen","0"]] },
          { key:"w", label:"Low wellbeing", vals:[["Low wellbeing","1"],["Not low","0"]] },
        ];
        const lensByKey = Object.fromEntries(LENSES.map(l=>[l.key,l]));

        // Build scored items with their fav/con option sets
        const scoredItems = [];
        for (const engId of Object.keys(catalog)) {
          const q = catalog[engId];
          const sc = scoreQuestion(engId, q.options);
          if (!sc) continue;
          const favSet = new Set(sc.fav), conSet = new Set(sc.con);
          if (q.type === "matrix") {
            (q.rows||[]).forEach((rl,ri)=>scoredItems.push({ engId, rowIdx:ri, type:"matrix", label:q.heading+" - "+rl, domains:q.domains||[], favSet, conSet }));
          } else {
            scoredItems.push({ engId, type:q.type, label:q.heading, domains:q.domains||[], favSet, conSet });
          }
        }

        // Rate of fav/con for an item over a given subset of rows
        const rateOf = (item, subset, dir) => {
          const set = dir==="fav"?item.favSet:item.conSet;
          let hit=0, n=0;
          for (const r of subset) {
            const v = r.q?.[item.engId];
            if (item.type==="matrix") {
              if (!v || typeof v!=="object" || Array.isArray(v)) continue;
              const col=v[item.rowIdx]; if (col==null) continue;
              n++; if (set.has(col)) hit++;
            } else if (item.type==="multi") {
              if (!Array.isArray(v)) continue;
              n++; if (v.some(x=>set.has(x))) hit++;
            } else {
              if (typeof v!=="number") continue;
              n++; if (set.has(v)) hit++;
            }
          }
          return { rate: n>0?hit/n*100:0, n };
        };

        // For each item, overall rate, then every 2-lens cell's rate + gap
        const findings = [];
        // Questions the wellbeing lens is derived from - exclude them when the
        // wellbeing lens is one of the paired lenses (circular: filtering by low
        // wellbeing and scoring the question that defines it always yields 100%).
        const WB_SOURCE = new Set(["289909905","292468426"]);
        for (const item of scoredItems) {
          const overall = rateOf(item, rows, scanDir);
          if (overall.n < scanMinN) continue;
          for (let x=0; x<LENSES.length; x++) {
            for (let y=x+1; y<LENSES.length; y++) {
              const L1=LENSES[x], L2=LENSES[y];
              // skip self-referential wellbeing pairings
              if ((L1.key==="w" || L2.key==="w") && WB_SOURCE.has(item.engId)) continue;
              for (const [lab1,code1] of L1.vals) {
                for (const [lab2,code2] of L2.vals) {
                  const cell = rows.filter(r => String(r[L1.key])===code1 && String(r[L2.key])===code2);
                  if (cell.length < scanMinN) continue;
                  const cr = rateOf(item, cell, scanDir);
                  if (cr.n < scanMinN) continue;
                  const gap = cr.rate - overall.rate;
                  // For 'con' we want cells worse than overall (positive gap); for 'fav' better than overall
                  if (gap <= 0) continue;
                  findings.push({
                    label:item.label, domains:item.domains,
                    lensLabel:`${L1.label}: ${lab1} + ${L2.label}: ${lab2}`,
                    cellRate:Math.round(cr.rate), overallRate:Math.round(overall.rate),
                    gap:Math.round(gap), n:cr.n,
                  });
                }
              }
            }
          }
        }
        findings.sort((a,b)=>b.gap-a.gap);
        const top = findings.slice(0, 60);

        return (
          <>
            <div style={{...s.card,padding:"12px 16px",marginBottom:14,fontSize:12,color:"#475569",lineHeight:1.5}}>
              <b>Disparity scanner.</b> Automatically scans every scored question against every pair of lenses and surfaces the cells that diverge most from the overall rate. Use it to find where disadvantage compounds (concerning) or where a group does notably well (favourable), without hunting combination by combination. Only cells with n ≥ {scanMinN} are shown.
            </div>

            <div style={{...s.card,padding:"12px 14px",marginBottom:14,display:"flex",gap:16,alignItems:"center",flexWrap:"wrap"}}>
              <div style={{display:"flex",gap:6}}>
                {[["con","Biggest concerns"],["fav","Biggest positives"]].map(([d,lab])=>(
                  <button key={d} onClick={()=>setScanDir(d)} style={{
                    padding:"6px 14px",fontSize:12,borderRadius:6,cursor:"pointer",fontWeight:scanDir===d?700:400,
                    border:"1px solid "+(scanDir===d?(d==="con"?"#dc2626":"#16a34a"):"#e2e8f0"),
                    background:scanDir===d?(d==="con"?"#dc2626":"#16a34a"):"#fff",color:scanDir===d?"#fff":"#475569",
                  }}>{lab}</button>
                ))}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:11,fontWeight:700,color:"#94a3b8",textTransform:"uppercase"}}>Min base</span>
                <select value={scanMinN} onChange={e=>setScanMinN(Number(e.target.value))}
                  style={{fontSize:12,border:"1px solid #e2e8f0",borderRadius:6,padding:"5px 8px",color:"#475569",cursor:"pointer"}}>
                  <option value={30}>n ≥ 30</option>
                  <option value={50}>n ≥ 50</option>
                  <option value={100}>n ≥ 100</option>
                  <option value={15}>n ≥ 15 (signals)</option>
                </select>
              </div>
              <span style={{fontSize:11,color:"#64748b"}}>{findings.length.toLocaleString()} disparities found · showing top {top.length}</span>
            </div>

            {top.length===0
              ? <div style={{...s.card,padding:20,textAlign:"center",color:"#94a3b8",fontSize:12}}>No disparities above threshold. Try lowering the minimum base.</div>
              : top.map((f,i)=>{
                  const col = scanDir==="con"?"#dc2626":"#16a34a";
                  return (
                    <div key={i} style={{...s.card,padding:"10px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:12}}>
                      <div style={{width:52,textAlign:"center",flexShrink:0}}>
                        <div style={{fontSize:20,fontWeight:800,color:col}}>+{f.gap}</div>
                        <div style={{fontSize:9,color:"#94a3b8"}}>pts</div>
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,fontWeight:600,color:"#0f172a",marginBottom:2}}>{f.label}</div>
                        <div style={{fontSize:11,color:"#475569"}}>
                          <span style={{fontWeight:600,color:col}}>{f.lensLabel}</span>
                          <span style={{color:"#94a3b8"}}> · </span>
                          {f.cellRate}% {scanDir==="con"?"concerning":"favourable"} vs {f.overallRate}% overall
                          <span style={{color:"#94a3b8"}}> · n={f.n}</span>
                        </div>
                        <div style={{marginTop:4,display:"flex",gap:2,alignItems:"center"}}>
                          <div style={{flex:1,height:6,background:"#f1f5f9",borderRadius:2,position:"relative",overflow:"hidden"}}>
                            <div style={{position:"absolute",left:0,top:0,height:"100%",width:f.overallRate+"%",background:"#cbd5e1"}}/>
                            <div style={{position:"absolute",left:0,top:0,height:"100%",width:f.cellRate+"%",background:col,opacity:0.55}}/>
                          </div>
                        </div>
                      </div>
                      <div style={{fontSize:9,color:"#94a3b8",flexShrink:0,textAlign:"right",width:60}}>
                        {(f.domains||[]).map(d=>domainLabels[d]?d:d).join(" ")}
                      </div>
                    </div>
                  );
                })}
            {top.length>0 && <div style={{fontSize:10,color:"#94a3b8",textAlign:"center",padding:"8px 0"}}>Ranked by gap from overall rate. Grey bar = overall rate, coloured bar = this group's rate. Small cells (n near threshold) are signals to investigate, not proven statistics.</div>}
          </>
        );
      })()}

      {/* ======================= VOICES (FREE-TEXT THEMES) ======================= */}
      {page === "voices" && (() => {
        if (!ftData) {
          return <div style={{...s.card,padding:24,textAlign:"center",color:"#94a3b8",fontSize:13}}>
            Free-text analysis not available yet. Run the <b>freetext-analysis</b> workflow to generate it - the first run discovers themes across all comments (this is the slower run), and later runs update incrementally.
          </div>;
        }
        const LENS_OPTS = [
          { key:"", label:"All responses", vals:[] },
          { key:"g", label:"Gender", vals:[["Male","Male"],["Female","Female"]] },
          { key:"i", label:"Income", vals:[["B40","B40"],["M40","M40"],["T20","T20"]] },
          { key:"a", label:"Age", vals:[["10-12","10-12"],["13-16","13-16"],["17","17"]] },
          { key:"d", label:"Disability", vals:[["Disabled","1"],["Not disabled","0"]] },
          { key:"m", label:"Migration", vals:[["Migrant/refugee","1"],["Citizen","0"]] },
          { key:"w", label:"Low wellbeing", vals:[["Low wellbeing","1"],["Not low","0"]] },
        ];
        const questions = ftData.questions || {};
        const MOD = { parent:"Parent", pregnant:"Pregnant", under10:"Under-10", child:"Child" };
        const lk = voiceLens.key, lv = voiceLens.value;
        // count for a theme under the active lens filter
        const themeCount = (th) => {
          if (!lk || !lv) return th.count;
          return (th.byLens?.[lk]?.[lv]) || 0;
        };

        return (
          <>
            <div style={{...s.card,padding:"12px 16px",marginBottom:14,fontSize:12,color:"#475569",lineHeight:1.5}}>
              <b>Voices.</b> Themes from the open-ended survey questions, across all four languages (translated to English). Themes are auto-coded from what respondents wrote; quotes are representative examples with contact details removed. Updated {ftData.updatedAt ? new Date(ftData.updatedAt).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : ""}.
            </div>

            {/* Single-lens filter */}
            <div className="cfp-sticky" style={{...s.card,padding:"10px 14px",marginBottom:14,top:8,zIndex:20,boxShadow:"0 2px 8px rgba(15,23,42,0.08)",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
              <span style={{fontSize:11,fontWeight:700,color:"#94a3b8",letterSpacing:"0.05em",textTransform:"uppercase"}}>Whose voices</span>
              <select value={lk} onChange={e=>setVoiceLens({key:e.target.value,value:""})}
                style={{fontSize:12,border:"1px solid #e2e8f0",borderRadius:6,padding:"5px 8px",cursor:"pointer",color:"#475569"}}>
                {LENS_OPTS.map(o=><option key={o.key} value={o.key}>{o.label}</option>)}
              </select>
              {lk && (
                <select value={lv} onChange={e=>setVoiceLens({key:lk,value:e.target.value})}
                  style={{fontSize:12,border:"1px solid "+(lv?"#0e4a6e":"#e2e8f0"),borderRadius:6,padding:"5px 8px",cursor:"pointer",color:lv?"#0e4a6e":"#475569",fontWeight:lv?600:400}}>
                  <option value="">Select...</option>
                  {(LENS_OPTS.find(o=>o.key===lk)?.vals||[]).map(([label,code])=><option key={code} value={code}>{label}</option>)}
                </select>
              )}
              {lk && lv && <span style={{fontSize:11,color:"#64748b"}}>showing theme frequencies for this group</span>}
            </div>

            {Object.keys(questions).map(engId=>{
              const q = questions[engId];
              const themes = [...(q.themes||[])].map(t=>({ ...t, shown:themeCount(t) })).sort((a,b)=>b.shown-a.shown);
              const maxc = Math.max(1, ...themes.map(t=>t.shown));
              const shownTotal = themes.reduce((s,t)=>s+t.shown,0);
              return (
                <div key={engId} style={{...s.card,padding:0,marginBottom:14,overflow:"hidden"}}>
                  <div style={{fontSize:13,fontWeight:700,color:"#fff",background:"#0e4a6e",padding:"8px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span>{q.short}</span>
                    <span style={{fontWeight:400,opacity:0.85,fontSize:11}}>{MOD[q.module]||q.module} · {q.total} comments</span>
                  </div>
                  <div style={{padding:"8px 14px 12px"}}>
                    {themes.length===0 && <div style={{fontSize:12,color:"#94a3b8"}}>No themes.</div>}
                    {themes.map((t,i)=>{
                      const pct = shownTotal>0?Math.round(t.shown/shownTotal*100):0;
                      return (
                        <div key={i} style={{padding:"7px 0",borderTop:i>0?"1px solid #f1f5f9":"none"}}>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}>
                            <div style={{flex:1,fontSize:12,fontWeight:600,color:"#0f172a"}}>{t.label}</div>
                            <div style={{width:120,height:12,background:"#f1f5f9",borderRadius:2,overflow:"hidden"}}>
                              <div style={{width:(t.shown/maxc*100)+"%",height:"100%",background:"#0e4a6e",borderRadius:2}}/>
                            </div>
                            <div style={{width:70,fontSize:11,fontWeight:700,color:"#334155",textAlign:"right"}}>{t.shown} <span style={{color:"#94a3b8",fontWeight:400}}>({pct}%)</span></div>
                          </div>
                          {t.desc && <div style={{fontSize:10,color:"#94a3b8",marginBottom:3}}>{t.desc}</div>}
                          {(!lk || !lv) && (t.quotes||[]).slice(0,2).map((quote,qi)=>(
                            <div key={qi} style={{fontSize:11,color:"#475569",fontStyle:"italic",borderLeft:"2px solid #cbd5e1",paddingLeft:8,margin:"3px 0"}}>"{quote}"</div>
                          ))}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
            <div style={{fontSize:10,color:"#94a3b8",textAlign:"center",padding:"8px 0"}}>Themes and quotes are machine-generated from translated free-text. Quotes have contact details removed; review before publishing.</div>
          </>
        );
      })()}

      {/* Footer */}
      <div style={{textAlign:"center",padding:"16px 0 8px",fontSize:10,color:"#94a3b8"}}>
        Child Friendly Penang - UNICEF Child-Friendly City Initiative - Think City / MBPP / MBSP - Data updates every 2 hours
      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(CFPDashboard), document.getElementById("root"));
</script>
</body>
</html>
