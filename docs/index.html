// ─── Scoring layer: favourable/concerning option indices per question ──────────
const SCORE_MODE = {
  "289909920":"agree","289909821":"agree","289909825":"agree","289909921":"agree","289909828":"agree",
  "289909831":"agree","289909837":"agree","289909847":"agree","289909857":"agree","289909860":"agree",
  "289909861":"agree","289909866":"agree","289909865":"agreeRev",
  "289909818":"freq","289909913":"freq","289909836":"freq","289909851":"freq","289909876":"freq","289909832":"freq",
  "289909896":"freqRev","289909815":"yesno","289909908":"yesno","289909911":"yesno","289909915":"yesno",
  "289909893":"yesno","289909918":"yesnoRev","289909834":"worry","289909864":"worry","289911742":"screen",
  "289909827":"visitfreq","289909853":"visitfreq","289909891":"playfreq","289909846":"knowRights",
  "289909889":"support","289909910":"antenatal","289909820":"multiNone","289909848":"multiNoOne",
  "289909887":"notSure","292468426":"freqRev","289909905":"wbMulti",
};
function scoreQuestion(engId, options) {
  const mode = SCORE_MODE[engId];
  if (!mode || !options) return null;
  const fav = [], con = [];
  options.forEach((opt,i)=>{
    const o = (opt||"").toLowerCase();
    switch(mode){
      case "agree": if(/strongly agree|^agree/.test(o))fav.push(i); else if(/strongly disagree|^disagree/.test(o))con.push(i); break;
      case "agreeRev": if(/strongly agree|^agree/.test(o))con.push(i); else if(/strongly disagree|^disagree/.test(o))fav.push(i); break;
      case "freq": if(/always|often/.test(o))fav.push(i); else if(/rarely|never/.test(o))con.push(i); break;
      case "freqRev": if(/never/.test(o))fav.push(i); else if(/very often|often|sometimes/.test(o))con.push(i); break;
      case "yesno": if(/^yes/.test(o))fav.push(i); else if(/^no\b|^no$/.test(o))con.push(i); break;
      case "yesnoRev": if(/^yes/.test(o))con.push(i); else if(/^no\b|^no$/.test(o))fav.push(i); break;
      case "worry": if(/extremely worried|very worried/.test(o))con.push(i); else if(/not at all|slightly worried/.test(o))fav.push(i); break;
      case "screen": if(/3-4|5-6|more than 6/.test(o))con.push(i); else if(/less than 1|1-2 hour/.test(o))fav.push(i); break;
      case "visitfreq": if(/every day|few times a week|once a week/.test(o))fav.push(i); else if(/less than once a month|never/.test(o))con.push(i); break;
      case "playfreq": if(/daily|few times a week/.test(o))fav.push(i); else if(/rarely|never/.test(o))con.push(i); break;
      case "knowRights": if(/know a lot|know a little/.test(o))fav.push(i); else if(/never heard/.test(o))con.push(i); break;
      case "support": if(/received enough/.test(o))fav.push(i); else if(/insuffic|could not acc|couldn't access/.test(o))con.push(i); break;
      case "antenatal": if(/^no\b|^no$/.test(o))fav.push(i); else if(/^yes/.test(o))con.push(i); break;
      case "multiNone": if(/none of the above/.test(o))con.push(i); else fav.push(i); break;
      case "multiNoOne": if(/no one/.test(o))con.push(i); else fav.push(i); break;
      case "notSure": if(/not sure/.test(o))con.push(i); break;
      case "wbMulti": if(/happy and positive|doing okay/.test(o))fav.push(i); else if(/worried|stressed|sad or low/.test(o))con.push(i); break;
    }
  });
  return { fav, con };
}

// ─── Wellbeing lens: derive "low wellbeing" per response from stored answers ────
// Uses 905 (how feeling lately, multi) and 292468426 (anxious/sad matrix).
// Low wellbeing = any sad/worried/stressed option in 905, OR often/sometimes
// anxious or sad in the matrix. Derived client-side (no pipeline rebuild).
function deriveWellbeing(row, catalog) {
  if (!catalog) return null;
  let answered = false, low = false;
  const q905 = catalog["289909905"];
  if (q905 && Array.isArray(row.q?.["289909905"])) {
    answered = true;
    const opts = q905.options || [];
    for (const idx of row.q["289909905"]) {
      const o = (opts[idx]||"").toLowerCase();
      if (/worried|stressed|sad or low/.test(o)) low = true;
    }
  }
  const qwb = catalog["292468426"];
  const vwb = row.q?.["292468426"];
  if (qwb && vwb && typeof vwb === "object" && !Array.isArray(vwb)) {
    answered = true;
    const opts = qwb.options || [];
    for (const ri of Object.keys(vwb)) {
      const o = (opts[vwb[ri]]||"").toLowerCase();
      if (/very often|often|sometimes/.test(o)) low = true;
    }
  }
  if (!answered) return null;
  return low ? 1 : 0;
}
function withWellbeing(rows, catalog) {
  return rows.map(r => (r.w !== undefined ? r : { ...r, w: deriveWellbeing(r, catalog) }));
}

// Tier multiplier (Option A: locks to 3D=×2 once 2D completions reached).

function scaleTbl(t) {
  const o = {};
  for (const [k, v] of Object.entries(t)) {
    if (typeof v === "number") o[k] = v * TIER_MULT;
    else { o[k] = {}; for (const [k2, v2] of Object.entries(v)) o[k][k2] = v2 * TIER_MULT; }
  }
  return o;
}

// ─── Helpers ───────────────────────────────────────────────────────────────────
function daysDiff(a, b) { return Math.floor((b - a) / 86400000); }
function cellPct(c) { return c.target > 0 ? Math.round(c.actual / c.target * 100) : 0; }
function cellColor(c) {
  const p = cellPct(c);
  if (p >= 100) return { bg:"#dcfce7", fg:"#15803d", bar:"#16a34a" };
  if (p >= 75)  return { bg:"#fef9c3", fg:"#854d0e", bar:"#ca8a04" };
  return              { bg:"#fee2e2", fg:"#b91c1c", bar:"#ef4444" };
}

// ─── Component ─────────────────────────────────────────────────────────────────
function CFPDashboard() {
  const [data, setData]           = useState(null);
  const [loading, setLoading]     = useState(true);
  const [error, setError]         = useState(null);
  const [dimIds, setDimIds]       = useState(["","",""]);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [page, setPage]           = useState("overview"); // "overview" | "crg"
  const [filters, setFilters]     = useState([]); // up to 3 active lens filters: [{lens, value}]
  const [qModule, setQModule]     = useState("parent"); // active module on the By-Question tab
  const [dunDistrict, setDunDistrict] = useState("All"); // district filter on Local Gaps tab
  const [rollupAxis, setRollupAxis] = useState("domain"); // 'domain' or 'objective' on Rollup tab
  const [scanDir, setScanDir]       = useState("con");    // 'con' or 'fav' - which extreme to rank
  const [scanMinN, setScanMinN]     = useState(30);       // min base size to surface
  const [ftData, setFtData]         = useState(null);     // free-text analysis (separate file)
  const [voiceLens, setVoiceLens]   = useState({ key:"", value:"" }); // single lens on Voices tab

  const loadData = useCallback(() => {
    // Cache-bust with timestamp so browser always fetches the freshest data.json
    fetch("data.json?t=" + Date.now(), { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error("data.json not found"); return r.json(); })
      .then(d => { setData(d); setLastUpdated(d.updatedAt ? new Date(d.updatedAt) : null); setError(null); })
      .catch(e => setError(e.message))
      .finally(() => setLoading(false));
    // Free-text analysis is a separate, optional file (may not exist until first run)
    fetch("freetext-analysis.json?t=" + Date.now(), { cache: "no-store" })
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d) setFtData(d); })
      .catch(() => {});
  }, []);

  useEffect(() => {
    loadData();
    // Auto-refresh every 5 minutes so the dashboard stays current without manual reload
    const interval = setInterval(loadData, 5 * 60 * 1000);
    return () => clearInterval(interval);
  }, [loadData]);

  const today = new Date();
  // Option A: once 2D (10,000) completions reached, sub-targets lock to 3D level (×2)
  TIER_MULT = (data?.totalCompleted || 0) >= STRETCH_2D_THRESHOLD ? 2 : 1;
  const daysElapsed   = Math.max(0, daysDiff(START_DATE, today));
  const daysRemaining = Math.max(0, daysDiff(today, END_DATE));
  const surveyStarted = today >= START_DATE;
  const totalDays     = daysDiff(START_DATE, END_DATE);
  const surveyPct     = Math.min(100, Math.round(daysElapsed / totalDays * 100));

  const allPanels = dimIds.filter(id=>id).map(id => {
    const dim = DIMS.find(d => d.id === id) || DIMS[0];
    const cells = data ? dim.get(data, daysElapsed, daysRemaining) : [];
    const behind = cells.filter(c => cellPct(c) < 75).sort((a,b) => cellPct(a)-cellPct(b));
    return { dim, cells, behind };
  });

  const activeDims = dimIds.filter(id=>id);
  const crossTabsToShow = [];
  const crossTabsMissing = [];
  for (let i=0; i<activeDims.length; i++) {
    for (let j=i+1; j<activeDims.length; j++) {
      const key = [activeDims[i], activeDims[j]].sort().join("|");
      const cfg = CROSS_TABS[key];
      if (cfg) crossTabsToShow.push({key, cfg});
      else {
        const la = DIMS.find(d=>d.id===activeDims[i])?.label || activeDims[i];
        const lb = DIMS.find(d=>d.id===activeDims[j])?.label || activeDims[j];
        crossTabsMissing.push(la+" x "+lb);
      }
    }
  }

  const totalStarted   = data?.totalStarted   || 0;
  const totalCompleted = data?.totalCompleted || 0;
  const respPct        = Math.min(100, Math.round(totalCompleted / TOTAL_TARGET * 100));
  const completionRate = totalStarted > 0 ? Math.round(totalCompleted / totalStarted * 100) : 0;
  const setDimId = (idx, val) => setDimIds(prev => prev.map((v,i) => i===idx ? val : v));

  const s = {
    card: { background:"#fff", borderRadius:10, border:"1px solid #e2e8f0" },
    label: { fontSize:11, fontWeight:700, color:"#94a3b8", letterSpacing:"0.05em", textTransform:"uppercase", marginBottom:4 },
  };

  return (
    <div style={{background:"#f1f5f9",minHeight:"100dvh",padding:16,maxWidth:1200,margin:"0 auto"}}>

      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
        <div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:"#0e4a6e",display:"inline-block"}}/>
            <h1 style={{margin:0,fontSize:17,fontWeight:700,color:"#0f172a"}}>Child Friendly Penang - Survey Monitor</h1>
          </div>
          <p style={{margin:"0 0 0 16px",fontSize:11,color:"#64748b"}}>
            {lastUpdated ? "Data updated "+lastUpdated.toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})+" - " : ""}
            {!surveyStarted ? "Survey starts in "+daysDiff(today,START_DATE)+" days (15 Jun)" : "Day "+daysElapsed+" of "+totalDays+" - "+daysRemaining+" days remaining"}
            {data?.noDistrict>0?" - "+data.noDistrict+" missing district":""}
          </p>
          <p style={{margin:"2px 0 0 16px",fontSize:10,color:"#94a3b8"}}>
            UNICEF Child-Friendly City Initiative - Think City / MBPP / MBSP
          </p>
        </div>
        <button onClick={loadData} disabled={loading}

            opacity:loading?0.5:1,whiteSpace:"nowrap"}}>
          {loading ? "Refreshing..." : "↻ Refresh"}
        </button>
      </div>

      {error && <div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:12,color:"#b91c1c"}}>{error}</div>}
      {loading && <div style={{display:"flex",alignItems:"center",gap:8,background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:12,color:"#64748b"}}>Loading survey data...</div>}

      {/* Page toggle */}
      <div style={{display:"flex",gap:4,marginBottom:14,background:"#e2e8f0",borderRadius:8,padding:3,width:"fit-content"}}>
        {[{id:"overview",label:"Survey Overview"},{id:"crg",label:"Child Reference Group"},{id:"findings_ro",label:"Findings: Research Objectives"},{id:"findings_afc",label:"Findings: AFC Domains"},{id:"findings_q",label:"Findings: By Question"},{id:"rollup",label:"Rollup"},{id:"scanner",label:"Disparity Scanner"},{id:"voices",label:"Voices"},{id:"local_gaps",label:"Local Gaps"}].map(p=>(
          <button key={p.id} onClick={()=>setPage(p.id)}
            style={{padding:"7px 16px",fontSize:12,fontWeight:600,borderRadius:6,border:"none",cursor:"pointer",
              background:page===p.id?"#fff":"transparent",color:page===p.id?"#0e4a6e":"#64748b",
              boxShadow:page===p.id?"0 1px 2px rgba(0,0,0,0.08)":"none"}}>
            {p.label}
          </button>
        ))}
      </div>

      {/* ======================= OVERVIEW PAGE ======================= */}
      {page === "overview" && (<>
      {/* Headline stats */}
      <div style={{...s.card,padding:16,marginBottom:14}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,marginBottom:14,paddingBottom:14,borderBottom:"1px solid #f1f5f9"}}>
          <div>
            <div style={s.label}>Surveys started</div>
            <span style={{fontSize:32,fontWeight:800,color:"#0f172a"}}>{totalStarted.toLocaleString()}</span>
            <div style={{fontSize:11,color:"#64748b",marginTop:2}}>parent module opened</div>
          </div>
          <div>
            <div style={s.label}>Surveys completed</div>
            <span style={{fontSize:32,fontWeight:800,color:"#0f172a"}}>{totalCompleted.toLocaleString()}</span>
            {data && daysElapsed>0 && <div style={{fontSize:11,color:"#64748b",marginTop:4}}>~{Math.round(totalCompleted/daysElapsed)}/day{daysRemaining>0?" - Proj. "+(totalCompleted+Math.round(totalCompleted/daysElapsed)*daysRemaining).toLocaleString():""}</div>}
          </div>
          <div>
            <div style={s.label}>Completion rate</div>
            <span style={{fontSize:32,fontWeight:800,color:completionRate>=70?"#15803d":completionRate>=50?"#854d0e":"#b91c1c"}}>{completionRate}%</span>
            <div style={{fontSize:11,color:"#64748b",marginTop:2}}>started → submitted</div>
          </div>
        </div>

        {/* Tier progress */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14,paddingBottom:14,borderBottom:"1px solid #f1f5f9"}}>
          {[
            {label:"1D target",target:TOTAL_TARGET,desc:"statistically significant"},
            {label:"2D stretch",target:STRETCH_2D,desc:"cross-tab analysis"},
            {label:"3D stretch",target:STRETCH_3D,desc:"multi-dim. analysis"},
          ].map(({label,target,desc})=>{
            const pct = Math.min(100,Math.round(totalCompleted/target*100));
            const col = pct>=100?"#16a34a":pct>=50?"#ca8a04":"#94a3b8";
            return (
              <div key={label} style={{background:"#f8fafc",borderRadius:6,padding:"8px 10px",border:"1px solid #e2e8f0"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:4}}>
                  <span style={{fontSize:11,fontWeight:700,color:"#475569"}}>{label}</span>
                  <span style={{fontSize:11,fontWeight:700,color:col}}>{pct}%</span>
                </div>
                <div style={{height:4,background:"#e2e8f0",borderRadius:2,overflow:"hidden",marginBottom:4}}>
                  <div style={{width:pct+"%",height:"100%",background:col,borderRadius:2}}/>
                </div>
                <div style={{fontSize:10,color:"#94a3b8"}}>{totalCompleted.toLocaleString()} / {target.toLocaleString()} - {desc}</div>
              </div>

          })}
        </div>

        {/* Survey period + language */}
        <div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:16,alignItems:"start"}}>

            <div style={{display:"flex",alignItems:"center",gap:8,margin:"4px 0"}}>
              <div style={{flex:1,height:5,background:"#e2e8f0",borderRadius:3,overflow:"hidden"}}>
                <div style={{width:surveyPct+"%",height:"100%",background:"#0e4a6e",borderRadius:3}}/>
              </div>
              <span style={{fontSize:11,color:"#334155",fontWeight:600}}>{surveyPct}%</span>
            </div>
            <div style={{fontSize:11,color:"#64748b"}}>15 Jun - 31 Jul 2026</div>
          </div>
          <div>
            <div style={s.label}>By language</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginTop:4}}>
              {["English","Malay","Mandarin","Tamil"].map(l=>{
                const ld = data?.byLanguage?.[l] || {};
                const ls = ld.started||0, lc = ld.completed||0;
                const lPct = ls>0?Math.round(lc/ls*100):0;
                return (
                  <div key={l} style={{background:"#f8fafc",borderRadius:6,padding:"8px 10px",border:"1px solid #e2e8f0"}}>
                    <div style={{fontSize:11,fontWeight:600,color:"#475569",marginBottom:3}}>{l}</div>
                    <div style={{fontSize:16,fontWeight:800,color:"#0f172a"}}>{lc.toLocaleString()}</div>
                    <div style={{fontSize:10,color:"#64748b"}}>{ls.toLocaleString()} started - {lPct}%</div>
                    <div style={{height:3,background:"#e2e8f0",borderRadius:2,marginTop:4,overflow:"hidden"}}>
                      <div style={{width:lPct+"%",height:"100%",background:"#0e4a6e",borderRadius:2}}/>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>

      {/* Refugee / Stateless / Undocumented - monitored count (no quota) */}
      {data?.migration && (() => {
        const mig = data.migration;
        const distRows = ["Timur Laut","Barat Daya","SP Utara","SP Tengah","SP Selatan"];
        const miniBar = (obj, keys, labelFn) => {
          const max = Math.max(1, ...keys.map(k=>obj[k]||0));
          return keys.map(k=>(
            <div key={k} style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
              <div style={{width:74,fontSize:10,color:"#475569",textAlign:"right",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{labelFn?labelFn(k):k}</div>
              <div style={{flex:1,height:10,background:"#f1f5f9",borderRadius:2,overflow:"hidden"}}>
                <div style={{width:((obj[k]||0)/max*100)+"%",height:"100%",background:"#7c3aed",borderRadius:2}}/>
              </div>
              <div style={{width:26,fontSize:10,color:"#334155",fontWeight:600,textAlign:"right"}}>{obj[k]||0}</div>
            </div>
          ));
        };
        return (
          <div style={{...s.card,padding:16,marginBottom:14,borderLeft:"3px solid #7c3aed"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
              <div>
                <div style={{fontSize:12,fontWeight:700,color:"#0f172a"}}>Refugee / Stateless / Undocumented children</div>
                <div style={{fontSize:11,color:"#64748b",marginTop:2}}>Monitored count of a hard-to-reach group - tracking reach, not a quota</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:32,fontWeight:800,color:"#7c3aed"}}>{mig.total.toLocaleString()}</div>
                <div style={{fontSize:10,color:"#94a3b8"}}>completed responses</div>
              </div>
            </div>
            {mig.total > 0 ? (
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:16}}>
                <div><div style={s.label}>By district</div>{miniBar(mig.byDistrict, distRows)}</div>
                <div><div style={s.label}>By gender</div>{miniBar(mig.byGender, ["Male","Female"])}</div>
                <div><div style={s.label}>By age</div>{miniBar(mig.byAge, ["10-12","13-16","17"], k=>"Age "+k)}</div>
                <div><div style={s.label}>By income</div>{miniBar(mig.byIncome, ["B40","M40","T20","Not stated"])}</div>
              </div>
            ) : (
              <div style={{fontSize:12,color:"#94a3b8",padding:"4px 0"}}>No refugee/stateless/undocumented responses recorded yet.</div>
            )}
          </div>
        );
      })()}

      {/* Dimension selectors */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <span style={{fontSize:11,fontWeight:700,color:"#94a3b8",letterSpacing:"0.05em",textTransform:"uppercase"}}>Demographic quotas</span>
        <span style={{fontSize:11,fontWeight:600,color:TIER_MULT===2?"#7c3aed":"#0284c7",background:TIER_MULT===2?"#f3e8ff":"#e0f2fe",padding:"2px 8px",borderRadius:4}}>
          Sub-targets: {TIER_MULT===2?"3D level (20,000)":"2D level (10,000)"}
        </span>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}}>
        {dimIds.map((id,idx)=>(
          <div key={idx} style={{...s.card,padding:"12px 14px"}}>
            <div style={s.label}>Dimension {idx+1}</div>
            <select value={id} onChange={e=>setDimId(idx,e.target.value)}
              style={{fontSize:13,border:"1px solid #e2e8f0",borderRadius:6,padding:"6px 10px",color:id?"#0f172a":"#94a3b8",background:"#fff",width:"100%",cursor:"pointer"}}>
              <option value="">- select -</option>
              {DIMS.map(d=><option key={d.id} value={d.id}>{d.label}</option>)}
            </select>
          </div>
        ))}
      </div>

      {/* Dimension panels */}
      {data && allPanels.length > 0 && (
        <div style={{display:"grid",gridTemplateColumns:"repeat("+allPanels.length+",1fr)",gap:10,marginBottom:14,alignItems:"start"}}>
          {allPanels.map(({dim,cells,behind},idx)=>(
            <div key={idx} style={{...s.card,overflow:"hidden"}}>
              <div style={{padding:"10px 14px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:12,fontWeight:700,color:"#0f172a"}}>{dim.label}</span>
                {behind.length>0
                  ? <span style={{fontSize:11,background:"#fee2e2",color:"#b91c1c",padding:"2px 7px",borderRadius:4,fontWeight:600}}>! {behind.length} behind</span>
                  : <span style={{fontSize:11,background:"#dcfce7",color:"#15803d",padding:"2px 7px",borderRadius:4,fontWeight:600}}>On track</span>}
              </div>
              <div>
                {cells.map((c,i)=>{
                  const pct = cellPct(c);
                  const cc = cellColor(c);
                  return (
                    <div key={c.id} style={{padding:"7px 14px",borderBottom:i<cells.length-1?"1px solid #f8fafc":"none",display:"flex",alignItems:"center",gap:8}}>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:11,fontWeight:500,color:"#334155",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",marginBottom:3}}>{c.label}</div>
                        <div style={{display:"flex",alignItems:"center",gap:5}}>
                          <div style={{flex:1,height:4,background:"#f1f5f9",borderRadius:2,overflow:"hidden"}}>
                            <div style={{width:Math.min(pct,100)+"%",height:"100%",background:cc.bar,borderRadius:2}}/>
                          </div>
                          <span style={{fontSize:10,color:"#94a3b8",width:24,textAlign:"right"}}>{pct}%</span>
                        </div>
                      </div>
                      <span style={{fontSize:11,fontWeight:700,background:cc.bg,color:cc.fg,padding:"2px 6px",borderRadius:4,whiteSpace:"nowrap"}}>{c.actual}/{c.target}</span>
                    </div>
                  );
                })}
              </div>
              {behind.length>0&&(
                <div style={{borderTop:"1px solid #e2e8f0",background:"#fffbf5"}}>
                  {behind.map((c,i)=>{
                    const pct=cellPct(c);
                    return (
                      <div key={c.id} style={{padding:"9px 14px",borderBottom:i<behind.length-1?"1px solid #fef3c7":"none"}}>
                        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                          <span style={{fontSize:11,fontWeight:700,color:pct<50?"#b91c1c":"#854d0e"}}>{c.label}</span>
                          <span style={{fontSize:10,color:"#92400e"}}>{pct}%{c.proj!==null?" - proj. "+c.proj:""}</span>
                        </div>
                        {c.actions.map((action,ai)=>(
                          <div key={ai} style={{fontSize:11,color:"#475569",lineHeight:1.4,marginBottom:3,paddingLeft:8,borderLeft:"2px solid #fde68a"}}>
                            {action}
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {/* Cross-tabs */}
      {data && activeDims.length >= 2 && (
        <div style={{marginTop:10}}>
          {crossTabsToShow.map(({key, cfg}) => {
            const {label, rows, cols, getVal, getQ} = cfg;
            let grandA=0, grandT=0;
            const rowA={}, rowT={}, colA={}, colT={}, ctCells={};
            rows.forEach(r => { rowA[r]=0; rowT[r]=0; });
            cols.forEach(c => { colA[c]=0; colT[c]=0; });
            rows.forEach(r => cols.forEach(c => {
              const actual = getVal(data,r,c), target = getQ(r,c);
              ctCells[r+"|"+c] = {actual, target};
              rowA[r]+=actual; rowT[r]+=target; colA[c]+=actual; colT[c]+=target;
              grandA+=actual; grandT+=target;
            }));
            const thBase = {padding:"7px 12px",fontSize:11,fontWeight:600,color:"#64748b",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",textAlign:"center",whiteSpace:"nowrap"};
            return (
              <div key={key} style={{...s.card,marginBottom:10,overflow:"hidden"}}>
                <div style={{padding:"10px 14px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:12,fontWeight:700,color:"#0f172a"}}>{label}</span>
                  <span style={{fontSize:11,color:"#94a3b8"}}>actual / target</span>
                </div>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                    <thead><tr>
                      <th style={{...thBase,textAlign:"left",borderRight:"1px solid #e2e8f0"}}></th>
                      {cols.map(c=><th key={c} style={thBase}>{c}</th>)}
                      <th style={{...thBase,borderLeft:"1px solid #e2e8f0",color:"#334155",fontWeight:700}}>Total</th>
                    </tr></thead>
                    <tbody>
                      {rows.map(r=>(
                        <tr key={r} style={{borderBottom:"1px solid #f1f5f9"}}>
                          <td style={{padding:"6px 12px",fontSize:11,fontWeight:500,color:"#334155",background:"#f8fafc",borderRight:"1px solid #e2e8f0",whiteSpace:"nowrap"}}>{r}</td>
                          {cols.map(c=>{
                            const {actual,target}=ctCells[r+"|"+c];
                            const pct=target>0?Math.round(actual/target*100):0;
                            const cc=cellColor({actual,target});
                            return (
                              <td key={c} style={{padding:"6px 10px",textAlign:"center",background:cc.bg}}>
                                <div style={{fontWeight:700,color:cc.fg,whiteSpace:"nowrap"}}>{actual}/{target}</div>
                                <div style={{fontSize:9,color:cc.fg,opacity:0.75}}>{pct}%</div>
                              </td>
                            );
                          })}
                          <td style={{padding:"6px 10px",textAlign:"center",borderLeft:"1px solid #e2e8f0",background:"#f1f5f9"}}>
                            <div style={{fontWeight:700,color:"#334155",whiteSpace:"nowrap"}}>{rowA[r]}/{rowT[r]}</div>
                            <div style={{fontSize:9,color:"#64748b"}}>{rowT[r]>0?Math.round(rowA[r]/rowT[r]*100):0}%</div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                    <tfoot>
                      <tr style={{borderTop:"2px solid #e2e8f0",background:"#f1f5f9"}}>
                        <td style={{padding:"6px 12px",fontSize:11,fontWeight:700,color:"#334155",borderRight:"1px solid #e2e8f0"}}>Total</td>
                        {cols.map(c=>(<td key={c} style={{padding:"6px 10px",textAlign:"center"}}><div style={{fontWeight:700,color:"#334155",whiteSpace:"nowrap"}}>{colA[c]}/{colT[c]}</div><div style={{fontSize:9,color:"#64748b"}}>{colT[c]>0?Math.round(colA[c]/colT[c]*100):0}%</div></td>))}
                        <td style={{padding:"6px 10px",textAlign:"center",borderLeft:"1px solid #e2e8f0"}}><div style={{fontWeight:700,color:"#0f172a",whiteSpace:"nowrap"}}>{grandA}/{grandT}</div><div style={{fontSize:9,color:"#64748b"}}>{grandT>0?Math.round(grandA/grandT*100):0}%</div></td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </div>
            );
          })}
          {crossTabsMissing.length>0 && (<div style={{fontSize:11,color:"#94a3b8",padding:"8px 12px",background:"#f8fafc",borderRadius:8,border:"1px solid #e2e8f0",marginBottom:10}}>Cross-tab not available for: {crossTabsMissing.join(", ")}</div>)}

          {/* 3-way achievability */}
          {activeDims.length === 3 && (() => {
            const dimMarginals = {
              "1d_district":{cats:DISTRICTS,targets:Q1.district},"1d_ethnicity":{cats:ETHNICITIES,targets:Q1.ethnicity},
              "1d_income":{cats:INCOME_GROUPS,targets:Q1.income},"1d_age":{cats:AGE_GROUPS,targets:Q1.age},
              "1d_gender":{cats:["Male","Female"],targets:Q1.gender},
            };
            const d1=dimMarginals[activeDims[0]], d2=dimMarginals[activeDims[1]], d3=dimMarginals[activeDims[2]];
            if (!d1||!d2||!d3) return null;
            const d1Label=DIMS.find(d=>d.id===activeDims[0])?.label;
            const d2Label=DIMS.find(d=>d.id===activeDims[1])?.label;
            const d3Label=DIMS.find(d=>d.id===activeDims[2])?.label;
            const d1Total=Object.values(d1.targets).reduce((a,b)=>a+b,0);
            const d2Total=Object.values(d2.targets).reduce((a,b)=>a+b,0);
            const d3Total=Object.values(d3.targets).reduce((a,b)=>a+b,0);
            const allCells=[];
            d1.cats.forEach(c1=>d2.cats.forEach(c2=>d3.cats.forEach(c3=>{
              const prop=(d1.targets[c1]/d1Total)*(d2.targets[c2]/d2Total)*(d3.targets[c3]/d3Total);
              allCells.push({label:c1+" x "+c2+" x "+c3,prop});
            })));
            const sorted=[...allCells].sort((a,b)=>a.prop-b.prop);
            const total=allCells.length;
            const count100=(tier)=>allCells.filter(c=>Math.ceil(100/c.prop)<=tier).length;
            return (
              <div style={{...s.card,marginBottom:10,overflow:"hidden"}}>
                <div style={{padding:"10px 14px",background:"#f0f0ff",borderBottom:"1px solid #e2e8f0"}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#0f172a",marginBottom:4}}>3-way cell achievability - {d1Label} x {d2Label} x {d3Label}</div>
                  <div style={{fontSize:11,color:"#64748b"}}>{"n \u2265 100 in cell = adequate for analysis"}</div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:0,borderBottom:"1px solid #e2e8f0"}}>
                  {[{label:"1D (2,500)",n:TOTAL_TARGET},{label:"2D (10,000)",n:STRETCH_2D},{label:"3D (20,000)",n:STRETCH_3D}].map(t=>(
                    <div key={t.label} style={{padding:"10px 14px",borderRight:"1px solid #f1f5f9"}}>
                      <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",marginBottom:4}}>{t.label}</div>
                      <div style={{fontSize:11}}>
                        <span style={{color:"#15803d",fontWeight:600}}>Achievable: {count100(t.n)}/{total}</span>
                      </div>
                    </div>
                  ))}
                </div>
                <div style={{overflowX:"auto",maxHeight:300,overflowY:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                    <thead style={{position:"sticky",top:0,zIndex:1}}><tr>
                      <th style={{padding:"6px 12px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",textAlign:"left",fontSize:10,fontWeight:600,color:"#64748b"}}>Cell</th>
                      <th style={{padding:"6px 10px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",textAlign:"center",fontSize:10,fontWeight:600,color:"#64748b"}}>% of pop.</th>
                      <th style={{padding:"6px 10px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",textAlign:"center",fontSize:10,fontWeight:600,color:"#64748b"}}><div>Collected / needed</div><div style={{fontWeight:400,color:"#94a3b8"}}>{"for n \u2265 100"}</div></th>
                      <th style={{padding:"6px 10px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",textAlign:"center",fontSize:10,fontWeight:600,color:"#64748b"}}>Progress</th>
                      <th style={{padding:"6px 10px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",textAlign:"center",fontSize:10,fontWeight:600,color:"#64748b"}}>Verdict</th>
                    </tr></thead>
                    <tbody>
                      {sorted.map((c,i)=>{
                        const need100=c.prop>0?Math.ceil(100/c.prop):Infinity;
                        const verdict=need100<=TOTAL_TARGET?"1D target":need100<=STRETCH_2D?"2D stretch":need100<=STRETCH_3D?"3D stretch":"Out of reach";
                        const vColor=verdict==="1D target"?"#15803d":verdict==="2D stretch"?"#0284c7":verdict==="3D stretch"?"#7c3aed":"#b91c1c";
                        const pct=need100<Infinity?Math.min(100,Math.round(totalCompleted/need100*100)):0;
                        return (
                          <tr key={i} style={{borderBottom:"1px solid #f8fafc"}}>
                            <td style={{padding:"5px 12px",whiteSpace:"nowrap",color:"#334155",fontWeight:500}}>{c.label}</td>
                            <td style={{padding:"5px 10px",textAlign:"center",color:"#64748b"}}>{(c.prop*100).toFixed(1)}%</td>
                            <td style={{padding:"5px 10px",textAlign:"center"}}><span style={{fontWeight:700,color:"#0f172a"}}>{totalCompleted.toLocaleString()}</span><span style={{color:"#94a3b8"}}> / </span><span style={{fontWeight:600,color:need100>100000?"#b91c1c":"#334155"}}>{need100>100000?"n/a":need100.toLocaleString()}</span></td>
                            <td style={{padding:"5px 10px",width:80}}><div style={{display:"flex",alignItems:"center",gap:4}}><div style={{flex:1,height:4,background:"#f1f5f9",borderRadius:2,overflow:"hidden"}}><div style={{width:pct+"%",height:"100%",background:vColor,borderRadius:2}}/></div><span style={{fontSize:10,color:"#64748b",width:28,textAlign:"right"}}>{pct}%</span></div></td>
                            <td style={{padding:"5px 10px",textAlign:"center"}}><span style={{fontSize:10,fontWeight:700,color:vColor,background:vColor+"18",padding:"2px 6px",borderRadius:4,whiteSpace:"nowrap"}}>{verdict}</span></td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            );
          })()}
        </div>
      )}

      {/* Chart */}
      {(() => {
        const activeDimId = dimIds.find(id => id && DIM_CHART_CONFIG[id]);
        const cfg = activeDimId ? DIM_CHART_CONFIG[activeDimId] : null;
        const activeDimLabel = cfg ? DIMS.find(d=>d.id===activeDimId)?.label : null;
        const sums = {};
        const chartData = [];
        const d = new Date(START_DATE);
        while (d <= today) {
          const key = d.toISOString().split("T")[0];
          const point = { label: d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}) };
          if (cfg) {
            const daySlice = data?.[cfg.key]?.[key] || {};
            cfg.cats.forEach(cat => { sums[cat]=(sums[cat]||0)+(daySlice[cat]||0); point[cat]=sums[cat]; });
          } else {
            const entry = data?.byDate?.[key] || {};
            sums.started=(sums.started||0)+(entry.started||0); sums.completed=(sums.completed||0)+(entry.completed||0);
            point.started=sums.started; point.completed=sums.completed;
            point.dailyCompleted = entry.completed || 0; // per-day (non-cumulative) for tail-off view
          }
          chartData.push(point);
          d.setDate(d.getDate()+1);
        }
        const lines = cfg ? cfg.cats : ["started","completed"];
        const hasData = chartData.some(pt=>lines.some(l=>(pt[l]||0)>0));
        return (
          <div style={{...s.card,padding:"14px 16px",marginTop:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <span style={{fontSize:12,fontWeight:700,color:"#0f172a"}}>Daily progress{activeDimLabel?" - "+activeDimLabel:""}</span>
              <span style={{fontSize:11,color:"#94a3b8"}}>{cfg?"Cumulative completed":"Cumulative (lines) + completed per day (bars)"} - 1D 2,500 / 2D 10,000 / 3D 20,000</span>
            </div>
            {!hasData
              ? <div style={{height:180,display:"flex",alignItems:"center",justifyContent:"center",color:"#94a3b8",fontSize:12}}>{today<START_DATE?"Survey opens 15 Jun":"No response data yet"}</div>
              : cfg
                ? <ResponsiveContainer width="100%" height={200}>
                  <LineChart data={chartData} margin={{top:4,right:50,left:0,bottom:0}}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" vertical={false}/>
                    <XAxis dataKey="label" tick={{fontSize:10,fill:"#94a3b8"}} tickLine={false} axisLine={false} interval={Math.max(0,Math.floor(chartData.length/7)-1)}/>
                    <YAxis tick={{fontSize:10,fill:"#94a3b8"}} tickLine={false} axisLine={false} width={42}/>
                    <Tooltip contentStyle={{fontSize:11,borderRadius:6,border:"1px solid #e2e8f0",boxShadow:"none"}} labelStyle={{fontWeight:600,color:"#0f172a"}}/>
                    <Legend iconType="circle" iconSize={7} wrapperStyle={{fontSize:11,paddingTop:6}}/>
                    {lines.map((l,i)=>(
                      <Line key={l} type="monotone" dataKey={l} name={l} stroke={CHART_COLORS[i%CHART_COLORS.length]}
                        strokeWidth={1.5} dot={false} activeDot={{r:3}}/>
                    ))}
                  </LineChart>
                </ResponsiveContainer>
                : <ResponsiveContainer width="100%" height={220}>
                  <ComposedChart data={chartData} margin={{top:4,right:8,left:0,bottom:0}}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" vertical={false}/>
                    <XAxis dataKey="label" tick={{fontSize:10,fill:"#94a3b8"}} tickLine={false} axisLine={false} interval={Math.max(0,Math.floor(chartData.length/7)-1)}/>
                    <YAxis yAxisId="left" tick={{fontSize:10,fill:"#94a3b8"}} tickLine={false} axisLine={false} width={42}/>
                    <YAxis yAxisId="right" orientation="right" tick={{fontSize:10,fill:"#0284c7"}} tickLine={false} axisLine={false} width={38}/>
                    <Tooltip contentStyle={{fontSize:11,borderRadius:6,border:"1px solid #e2e8f0",boxShadow:"none"}} labelStyle={{fontWeight:600,color:"#0f172a"}}/>
                    <Legend iconType="circle" iconSize={7} wrapperStyle={{fontSize:11,paddingTop:6}}/>
                    <Bar yAxisId="right" dataKey="dailyCompleted" name="Completed/day" fill="#bae6fd" radius={[2,2,0,0]} maxBarSize={18}/>
                    <Line yAxisId="left" type="monotone" dataKey="completed" name="Cumulative completed" stroke="#0e4a6e" strokeWidth={2} dot={false} activeDot={{r:3}}/>
                    <Line yAxisId="left" type="monotone" dataKey="started" name="Cumulative started" stroke="#94a3b8" strokeWidth={1.5} strokeDasharray="4 2" dot={false} activeDot={{r:3}}/>
                  </ComposedChart>
                </ResponsiveContainer>
            }
          </div>
        );
      })()}
      </>)}

      {/* ======================= CHILD REFERENCE GROUP PAGE ======================= */}
      {page === "crg" && (() => {
        const crg = data?.crg;
        if (!crg) return <div style={{...s.card,padding:24,textAlign:"center",color:"#94a3b8",fontSize:13}}>No Child Reference Group data yet.</div>;

        const completed1316 = (() => {
          // total completed responses aged 13-16, for sign-up rate denominator
          let n = 0;
          for (const dist of DISTRICTS) n += data?.ageByDistrict?.[dist]?.["13-16"] || 0;
          return n;
        })();
        const signupRate = completed1316 > 0 ? Math.round(crg.eligible1316 / completed1316 * 100) : 0;

        const Bar = ({rows, getLabel, getVal, max}) => (
          <div>
            {rows.map((r,i)=>{
              const v = getVal(r);
              const pct = max>0 ? Math.round(v/max*100) : 0;
              return (
                <div key={i} style={{padding:"7px 14px",borderBottom:i<rows.length-1?"1px solid #f8fafc":"none",display:"flex",alignItems:"center",gap:8}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:11,fontWeight:500,color:"#334155",marginBottom:3}}>{getLabel(r)}</div>
                    <div style={{height:4,background:"#f1f5f9",borderRadius:2,overflow:"hidden"}}>
                      <div style={{width:pct+"%",height:"100%",background:"#7c3aed",borderRadius:2}}/>
                    </div>
                  </div>
                  <span style={{fontSize:12,fontWeight:700,color:"#0f172a",width:36,textAlign:"right"}}>{v}</span>
                </div>
              );
            })}
          </div>
        );

        const card = (title, children) => (
          <div style={{...s.card,overflow:"hidden"}}>
            <div style={{padding:"10px 14px",background:"#faf5ff",borderBottom:"1px solid #e2e8f0"}}>
              <span style={{fontSize:12,fontWeight:700,color:"#0f172a"}}>{title}</span>
            </div>
            {children}
          </div>
        );

        const distRows = DISTRICTS;
        const distMax = Math.max(1, ...distRows.map(d=>crg.byDistrict[d]||0));
        const ethRows = ETHNICITIES;
        const ethMax = Math.max(1, ...ethRows.map(e=>crg.byEthnicity[e]||0));
        const incRows = INCOME_GROUPS;
        const incMax = Math.max(1, ...incRows.map(i=>crg.byIncome[i]||0));
        const genRows = ["Male","Female"];
        const genMax = Math.max(1, ...genRows.map(g=>crg.byGender[g]||0));
        const urRows = ["Urban","Peri-urban","Rural"];
        const urMax = Math.max(1, ...urRows.map(u=>crg.byUrbanRural[u]||0));

        return (
          <>
            {/* CRG headline */}
            <div style={{...s.card,padding:16,marginBottom:14}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16}}>
                <div>
                  <div style={s.label}>Total sign-ups</div>
                  <span style={{fontSize:32,fontWeight:800,color:"#7c3aed"}}>{crg.total.toLocaleString()}</span>
                  <div style={{fontSize:11,color:"#64748b",marginTop:2}}>contact details provided</div>
                </div>
                <div>
                  <div style={s.label}>Eligible (aged 13-16)</div>
                  <span style={{fontSize:32,fontWeight:800,color:"#0f172a"}}>{crg.eligible1316.toLocaleString()}</span>
                  <div style={{fontSize:11,color:"#64748b",marginTop:2}}>CRG is open to 13-16 only</div>
                </div>
                <div>
                  <div style={s.label}>Sign-up rate (13-16)</div>
                  <span style={{fontSize:32,fontWeight:800,color:signupRate>=25?"#15803d":signupRate>=10?"#854d0e":"#b91c1c"}}>{signupRate}%</span>
                  <div style={{fontSize:11,color:"#64748b",marginTop:2}}>of {completed1316.toLocaleString()} completed 13-16</div>
                </div>
              </div>
              <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid #f1f5f9",fontSize:11,color:"#64748b",lineHeight:1.5}}>
                The Child Reference Group is open to children aged 13-16. The eligible count and sign-up rate above reflect that band. The breakdowns below show all sign-ups by demographic. Contact details themselves are stored separately and are never shown here - only counts.
              </div>
            </div>

            {/* Note if sign-ups outside eligible band */}
            {(crg.byAge["10-12"]>0 || crg.byAge["17"]>0) && (
              <div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:11,color:"#92400e"}}>
                Note: {crg.byAge["10-12"]} sign-up(s) aged 10-12 and {crg.byAge["17"]} aged 17 fall outside the eligible 13-16 band. These may need follow-up or exclusion.
              </div>
            )}

            {/* Demographic breakdowns */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:14,alignItems:"start"}}>
              {card("By District", <Bar rows={distRows} getLabel={d=>d} getVal={d=>crg.byDistrict[d]||0} max={distMax}/>)}
              {card("By Ethnicity", <Bar rows={ethRows} getLabel={e=>e} getVal={e=>crg.byEthnicity[e]||0} max={ethMax}/>)}
              {card("By Household Income", <Bar rows={incRows} getLabel={i=>i} getVal={i=>crg.byIncome[i]||0} max={incMax}/>)}
              {card("By Child Gender", <Bar rows={genRows} getLabel={g=>g} getVal={g=>crg.byGender[g]||0} max={genMax}/>)}
              {card("By Urban / Rural", <Bar rows={urRows} getLabel={u=>u} getVal={u=>crg.byUrbanRural[u]||0} max={urMax}/>)}
            </div>
          </>
        );
      })()}

      {/* ======================= FINDINGS PAGES (RO + AFC) ======================= */}
      {(page === "findings_ro" || page === "findings_afc") && (() => {
        const rows = data?.questionRows;
        const catalog = data?.surveyQuestions;
        const roLabels = data?.roLabels || {};
        const domainLabels = data?.domainLabels || {};
        const domainOrder = data?.domainOrder || ["OS","TR","HO","SP","RI","CP","CI","HS"];
        if (!rows || !rows.length || !catalog) {
          return <div style={{...s.card,padding:24,textAlign:"center",color:"#94a3b8",fontSize:13}}>No question data yet. Run the pipeline to populate findings.</div>;
        }

        const MODULE_TAG = { parent:"Parent", pregnant:"Pregnant", under10:"Under-10", child:"Child" };
        const LENS_DEFS = [
          { key:"g", label:"Gender", values:[["Male","Male"],["Female","Female"]] },
          { key:"a", label:"Age", values:[["10-12","10-12"],["13-16","13-16"],["17","17"]] },
          { key:"i", label:"Income", values:[["B40","B40"],["M40","M40"],["T20","T20"]] },
          { key:"u", label:"Urban/Rural", values:[["Urban","Urban"],["Peri-urban","Peri-urban"],["Rural","Rural"]] },
          { key:"d", label:"Disability", values:[["Disabled",1],["Not disabled",0]] },
          { key:"m", label:"Migration", values:[["Migrant/refugee",1],["Citizen",0]] },
          { key:"w", label:"Wellbeing", values:[["Low wellbeing",1],["Not low",0]] },
        ];
        const lensUsed = (key) => filters.find(f => f.key === key);
        const setLensValue = (key, value) => setFilters(prev => {
          const without = prev.filter(f => f.key !== key);
          if (!value) return without;
          if (without.length >= 3 && !prev.find(f=>f.key===key)) return prev;
          return [...without, { key, value }];
        });
        const wbRows = withWellbeing(rows, catalog);
        const filtered = wbRows.filter(r => filters.every(f => String(r[f.key]) === String(f.value)));

        const RAMP5 = ["#16a34a","#84cc16","#eab308","#f97316","#dc2626"];
        const barColor = (nOpts, idx, agree) => (agree && nOpts === 5) ? RAMP5[idx] : "#0e4a6e";
        const singleDist = (engId, nOpts) => { const c=new Array(nOpts).fill(0); let n=0; for (const r of filtered){const v=r.q?.[engId]; if(typeof v==="number"&&v>=0&&v<nOpts){c[v]++;n++;}} return {c,n}; };
        const multiDist = (engId, nOpts) => { const c=new Array(nOpts).fill(0); let n=0; for (const r of filtered){const v=r.q?.[engId]; if(!Array.isArray(v))continue; n++; for(const i of v)if(i>=0&&i<nOpts)c[i]++;} return {c,n}; };
        const matrixRowDist = (engId, rowIdx, nOpts) => { const c=new Array(nOpts).fill(0); let n=0; for (const r of filtered){const v=r.q?.[engId]; if(!v||typeof v!=="object"||Array.isArray(v))continue; const col=v[rowIdx]; if(col==null)continue; if(col>=0&&col<nOpts){c[col]++;n++;}} return {c,n}; };
        const isAgree = (options) => options.some(o => /strongly agree|strongly disagree/i.test(o));

        const renderDist = (options, counts, n, agree, isMulti) => (
          <div>
            {options.map((opt,i)=>{ const pct=n>0?Math.round(counts[i]/n*100):0; return (
              <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                <div style={{width:150,fontSize:10,color:"#475569",textAlign:"right",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}} title={opt}>{opt}</div>
                <div style={{flex:1,height:14,background:"#f1f5f9",borderRadius:3,overflow:"hidden"}}>
                  <div style={{width:pct+"%",height:"100%",background:barColor(options.length,i,agree),borderRadius:3}}/>
                </div>
                <div style={{width:64,fontSize:10,color:"#334155",fontWeight:600}}>{pct}% <span style={{color:"#94a3b8",fontWeight:400}}>({counts[i]})</span></div>
              </div>
            );})}
            <div style={{fontSize:10,color:"#94a3b8",marginTop:4}}>
              {isMulti ? `${n} respondents answered · options sum to more than 100% (multi-select)` : `n = ${n}`}
              {n < 30 && n > 0 && <span style={{color:"#dc2626"}}> · low base</span>}
            </div>
          </div>
        );

        const questionCard = (engId) => {
          const q = catalog[engId]; if (!q) return null;
          const agree = isAgree(q.options);
          return (
            <div key={engId} style={{...s.card,padding:"14px 16px",marginBottom:10}}>
              <div style={{fontSize:12,fontWeight:700,color:"#0f172a",marginBottom:2}}>{q.heading}</div>
              <div style={{fontSize:10,color:"#94a3b8",marginBottom:10}}>
                <span style={{color:"#0e4a6e",fontWeight:600}}>{MODULE_TAG[q.module]||q.module}</span>
                {" · "}{q.type==="multi"?"Multiple choice (select all that apply)":q.type==="matrix"?"Matrix · one distribution per sub-statement":"Single choice"}
                {q.domains && q.domains.length>1 && <span> · appears in {q.domains.length} domains</span>}
              </div>
              {q.type==="single" && (()=>{ const {c,n}=singleDist(engId,q.options.length); return renderDist(q.options,c,n,agree,false); })()}
              {q.type==="multi" && (()=>{ const {c,n}=multiDist(engId,q.options.length); return renderDist(q.options,c,n,false,true); })()}
              {q.type==="matrix" && q.rows.map((rowLabel,ri)=>(
                <div key={ri} style={{marginBottom:12,paddingTop:8,borderTop:ri>0?"1px solid #f1f5f9":"none"}}>
                  <div style={{fontSize:11,fontWeight:600,color:"#334155",marginBottom:6}}>{rowLabel}</div>
                  {(()=>{ const {c,n}=matrixRowDist(engId,ri,q.options.length); return renderDist(q.options,c,n,agree,false); })()}
                </div>
              ))}
            </div>
          );
        };

        // Build groups
        const isRO = page === "findings_ro";
        const groups = isRO
          ? Object.keys(roLabels).map(ro => ({ key:ro, label:roLabels[ro], ids: Object.keys(catalog).filter(id => (catalog[id].ro||[]).map(String).includes(String(ro))) }))
          : domainOrder.map(dc => ({ key:dc, label:domainLabels[dc]||dc, ids: Object.keys(catalog).filter(id => (catalog[id].domains||[]).includes(dc)) }));

        return (
          <>
            {/* Filter bar (sticky) */}
            <div className="cfp-sticky" style={{...s.card,padding:"12px 14px",marginBottom:14,top:8,zIndex:20,boxShadow:"0 2px 8px rgba(15,23,42,0.08)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontSize:11,fontWeight:700,color:"#94a3b8",letterSpacing:"0.05em",textTransform:"uppercase"}}>Filter by lens (combine up to 3)</span>
                <span style={{fontSize:11,color:"#64748b"}}>
                  Showing <b style={{color:"#0f172a"}}>{filtered.length.toLocaleString()}</b> of {rows.length.toLocaleString()} responses
                  {filters.length>0 && <button onClick={()=>setFilters([])} style={{marginLeft:8,fontSize:11,color:"#0e4a6e",background:"none",border:"none",cursor:"pointer",textDecoration:"underline",padding:0}}>clear all</button>}
                </span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:8}}>
                {LENS_DEFS.map(ld=>{
                  const active = lensUsed(ld.key);
                  const atMax = filters.length>=3 && !active;
                  return (
                    <div key={ld.key}>
                      <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",marginBottom:3}}>{ld.label}</div>
                      <select value={active?active.value:""} disabled={atMax}
                        onChange={e=>setLensValue(ld.key, e.target.value)}
                        style={{fontSize:12,border:"1px solid "+(active?"#0e4a6e":"#e2e8f0"),borderRadius:6,padding:"5px 8px",width:"100%",
                          background:atMax?"#f1f5f9":"#fff",color:active?"#0e4a6e":"#475569",fontWeight:active?600:400,cursor:atMax?"not-allowed":"pointer"}}>
                        <option value="">All</option>
                        {ld.values.map(([label,code])=><option key={String(code)} value={String(code)}>{label}</option>)}
                      </select>
                    </div>
                  );
                })}
              </div>
              <div style={{fontSize:10,color:"#94a3b8",marginTop:6}}>
                {isRO ? "Grouped by Research Objective." : "Grouped by AFC domain. Questions touching several domains appear under each."}
              </div>
            </div>

            {/* Grouped question distributions */}
            {groups.map(g=>(
              <div key={g.key} style={{marginBottom:18}}>
                <div style={{fontSize:13,fontWeight:700,color:"#fff",background:"#0e4a6e",padding:"7px 14px",borderRadius:6,marginBottom:10}}>
                  {g.label} <span style={{fontWeight:400,opacity:0.8,fontSize:11}}>· {g.ids.length} question{g.ids.length===1?"":"s"}</span>
                </div>
                {g.ids.length===0
                  ? <div style={{fontSize:11,color:"#94a3b8",padding:"2px 4px"}}>No questions mapped.</div>
                  : g.ids.map(id=>questionCard(id))}
              </div>
            ))}
          </>
        );
      })()}

      {/* ======================= FINDINGS: BY QUESTION ======================= */}
      {page === "findings_q" && (() => {
        const rows = data?.questionRows;
        const catalog = data?.surveyQuestions;
        const moduleOrder = data?.questionModuleOrder || ["parent","pregnant","under10","child"];
        if (!rows || !rows.length || !catalog) {
          return <div style={{...s.card,padding:24,textAlign:"center",color:"#94a3b8",fontSize:13}}>No question data yet. Run the pipeline to populate this browser.</div>;
        }

        const MODULE_LABELS = { parent:"Parent", pregnant:"Pregnant / expecting", under10:"Under-10 (parent-reported)", child:"Child (10-17)" };
        const LENS_DEFS = [
          { key:"g", label:"Gender", values:[["Male","Male"],["Female","Female"]] },
          { key:"a", label:"Age", values:[["10-12","10-12"],["13-16","13-16"],["17","17"]] },
          { key:"i", label:"Income", values:[["B40","B40"],["M40","M40"],["T20","T20"]] },
          { key:"u", label:"Urban/Rural", values:[["Urban","Urban"],["Peri-urban","Peri-urban"],["Rural","Rural"]] },
          { key:"d", label:"Disability", values:[["Disabled",1],["Not disabled",0]] },
          { key:"m", label:"Migration", values:[["Migrant/refugee",1],["Citizen",0]] },
          { key:"w", label:"Wellbeing", values:[["Low wellbeing",1],["Not low",0]] },
        ];
        const lensUsed = (key) => filters.find(f => f.key === key);
        const setLensValue = (key, value) => setFilters(prev => {
          const without = prev.filter(f => f.key !== key);
          if (!value) return without;
          if (without.length >= 3 && !prev.find(f=>f.key===key)) return prev;
          return [...without, { key, value }];
        });

        const wbRows = withWellbeing(rows, catalog);
        const filtered = wbRows.filter(r => filters.every(f => String(r[f.key]) === String(f.value)));

        // Colour ramp for distribution bars (5-point scales get a red->green ramp; else neutral)
        const RAMP5 = ["#16a34a","#84cc16","#eab308","#f97316","#dc2626"];
        const barColor = (nOpts, idx, isAgreeScale) => {
          if (isAgreeScale && nOpts === 5) return RAMP5[idx];
          return "#0e4a6e";
        };

        // Distribution for single/menu: count each option index
        const singleDist = (engId, nOpts) => {
          const counts = new Array(nOpts).fill(0); let n = 0;
          for (const r of filtered) {
            const v = r.q?.[engId];
            if (v === undefined || v === null) continue;
            if (typeof v === "number" && v >= 0 && v < nOpts) { counts[v]++; n++; }
          }
          return { counts, n };
        };
        // Distribution for multi: count each option, denominator = respondents who answered
        const multiDist = (engId, nOpts) => {
          const counts = new Array(nOpts).fill(0); let n = 0;
          for (const r of filtered) {
            const v = r.q?.[engId];
            if (!Array.isArray(v)) continue;
            n++;
            for (const idx of v) if (idx >= 0 && idx < nOpts) counts[idx]++;
          }
          return { counts, n };
        };
        // Distribution for one matrix row: count each column index
        const matrixRowDist = (engId, rowIdx, nOpts) => {
          const counts = new Array(nOpts).fill(0); let n = 0;
          for (const r of filtered) {
            const v = r.q?.[engId];
            if (!v || typeof v !== "object" || Array.isArray(v)) continue;
            const col = v[rowIdx];
            if (col === undefined || col === null) continue;
            if (col >= 0 && col < nOpts) { counts[col]++; n++; }
          }
          return { counts, n };
        };

        const isAgreeScale = (options) => options.some(o => /strongly agree|strongly disagree/i.test(o));

        // A distribution renderer (options + counts + n)
        const renderDist = (options, counts, n, agreeScale, isMulti) => (
          <div>
            {options.map((opt, i) => {
              const pct = n > 0 ? Math.round(counts[i] / n * 100) : 0;
              return (
                <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                  <div style={{width:150,fontSize:10,color:"#475569",textAlign:"right",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}} title={opt}>{opt}</div>
                  <div style={{flex:1,height:14,background:"#f1f5f9",borderRadius:3,overflow:"hidden",position:"relative"}}>
                    <div style={{width:pct+"%",height:"100%",background:barColor(options.length,i,agreeScale),borderRadius:3}}/>
                  </div>
                  <div style={{width:64,fontSize:10,color:"#334155",fontWeight:600}}>{pct}% <span style={{color:"#94a3b8",fontWeight:400}}>({counts[i]})</span></div>
                </div>
              );
            })}
            <div style={{fontSize:10,color:"#94a3b8",marginTop:4}}>
              {isMulti ? `${n} respondents answered · options sum to more than 100% (multi-select)` : `n = ${n}`}
              {n < 30 && n > 0 && <span style={{color:"#dc2626"}}> · low base</span>}
            </div>
          </div>
        );

        // Questions in this module, in catalog (survey) order
        const moduleIds = Object.keys(catalog).filter(id => catalog[id].module === qModule);

        return (
          <>
            {/* Filter bar (shared, sticky) */}
            <div className="cfp-sticky" style={{...s.card,padding:"12px 14px",marginBottom:14,top:8,zIndex:20,boxShadow:"0 2px 8px rgba(15,23,42,0.08)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontSize:11,fontWeight:700,color:"#94a3b8",letterSpacing:"0.05em",textTransform:"uppercase"}}>Filter by lens (combine up to 3)</span>
                <span style={{fontSize:11,color:"#64748b"}}>
                  Showing <b style={{color:"#0f172a"}}>{filtered.length.toLocaleString()}</b> of {rows.length.toLocaleString()} responses
                  {filters.length>0 && <button onClick={()=>setFilters([])} style={{marginLeft:8,fontSize:11,color:"#0e4a6e",background:"none",border:"none",cursor:"pointer",textDecoration:"underline",padding:0}}>clear all</button>}
                </span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:8}}>
                {LENS_DEFS.map(ld=>{
                  const active = lensUsed(ld.key);
                  const atMax = filters.length>=3 && !active;
                  return (
                    <div key={ld.key}>
                      <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",marginBottom:3}}>{ld.label}</div>
                      <select value={active?active.value:""} disabled={atMax}
                        onChange={e=>setLensValue(ld.key, e.target.value)}
                        style={{fontSize:12,border:"1px solid "+(active?"#0e4a6e":"#e2e8f0"),borderRadius:6,padding:"5px 8px",width:"100%",
                          background:atMax?"#f1f5f9":"#fff",color:active?"#0e4a6e":"#475569",fontWeight:active?600:400,cursor:atMax?"not-allowed":"pointer"}}>
                        <option value="">All</option>
                        {ld.values.map(([label,code])=><option key={String(code)} value={String(code)}>{label}</option>)}
                      </select>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Module sub-tabs */}
            <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
              {moduleOrder.map(m=>(
                <button key={m} onClick={()=>setQModule(m)} style={{
                  padding:"6px 14px",fontSize:12,borderRadius:6,cursor:"pointer",fontWeight:qModule===m?700:400,
                  border:"1px solid "+(qModule===m?"#0e4a6e":"#e2e8f0"),background:qModule===m?"#0e4a6e":"#fff",color:qModule===m?"#fff":"#475569",
                }}>{MODULE_LABELS[m]||m}</button>
              ))}
            </div>

            {/* Question cards */}
            {moduleIds.length===0
              ? <div style={{...s.card,padding:20,textAlign:"center",color:"#94a3b8",fontSize:12}}>No questions in this module.</div>
              : moduleIds.map(engId=>{
                  const q = catalog[engId];
                  const agree = isAgreeScale(q.options);
                  return (
                    <div key={engId} style={{...s.card,padding:"14px 16px",marginBottom:10}}>
                      <div style={{fontSize:12,fontWeight:700,color:"#0f172a",marginBottom:2}}>{q.heading}</div>
                      <div style={{fontSize:10,color:"#94a3b8",marginBottom:10}}>
                        {q.type==="multi"?"Multiple choice (select all that apply)":q.type==="matrix"?"Matrix · one distribution per sub-statement":"Single choice"}
                      </div>
                      {q.type==="single" && (()=>{ const {counts,n}=singleDist(engId,q.options.length); return renderDist(q.options,counts,n,agree,false); })()}
                      {q.type==="multi" && (()=>{ const {counts,n}=multiDist(engId,q.options.length); return renderDist(q.options,counts,n,false,true); })()}
                      {q.type==="matrix" && q.rows.map((rowLabel,ri)=>(
                        <div key={ri} style={{marginBottom:12,paddingTop:8,borderTop:ri>0?"1px solid #f1f5f9":"none"}}>
                          <div style={{fontSize:11,fontWeight:600,color:"#334155",marginBottom:6}}>{rowLabel}</div>
                          {(()=>{ const {counts,n}=matrixRowDist(engId,ri,q.options.length); return renderDist(q.options,counts,n,agree,false); })()}
                        </div>
                      ))}
                    </div>
                  );
                })}
          </>
        );
      })()}

      {/* ======================= LOCAL GAPS (DUN ANALYSIS) ======================= */}
      {page === "local_gaps" && (() => {
        const byDUN = data?.byDUN;
        const dunMeta = data?.dunMeta;
        if (!byDUN || !dunMeta) {
          return <div style={{...s.card,padding:24,textAlign:"center",color:"#94a3b8",fontSize:13}}>No DUN data yet. Run the pipeline to populate local gaps.</div>;
        }

        // District colours
        const DISTRICT_COLOR = {
          "Timur Laut":"#0e4a6e","Barat Daya":"#0891b2",
          "SP Utara":"#7c3aed","SP Tengah":"#c026d3","SP Selatan":"#db2777",
        };
        const allDistricts = dunMeta.map(d=>d.district);

        // Build the flat list of DUNs per side (island / mainland), each with count + district
        const buildSide = (isIsland) => {
          const rows = [];
          for (const dm of dunMeta) {
            if (dm.island !== isIsland) continue;
            if (dunDistrict !== "All" && dm.district !== dunDistrict) continue;
            for (const dun of dm.duns) {
              rows.push({ dun, district: dm.district, count: byDUN[dun] || 0 });
            }
          }
          // sort by district (in dunMeta order) then by count desc within
          return rows;
        };
        const islandRows = buildSide(true);
        const mainlandRows = buildSide(false);
        const maxCount = Math.max(1, ...Object.values(byDUN));

        const chart = (title, rows, subtitle) => {
          if (!rows.length) return null;
          return (
            <div style={{...s.card,padding:16,marginBottom:14}}>
              <div style={{marginBottom:12}}>
                <div style={{fontSize:13,fontWeight:700,color:"#0f172a"}}>{title}</div>
                <div style={{fontSize:11,color:"#64748b"}}>{subtitle}</div>
              </div>
              {rows.map((r,i)=>{
                const prev = rows[i-1];
                const showDistrictHeader = !prev || prev.district !== r.district;
                return (
                  <div key={r.dun}>
                    {showDistrictHeader && (
                      <div style={{display:"flex",alignItems:"center",gap:6,margin:(i===0?"0":"10px")+" 0 5px"}}>
                        <span style={{width:9,height:9,borderRadius:2,background:DISTRICT_COLOR[r.district]||"#64748b",display:"inline-block"}}/>
                        <span style={{fontSize:11,fontWeight:700,color:"#334155"}}>{r.district}</span>
                      </div>
                    )}
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                      <div style={{width:130,fontSize:11,color:"#475569",textAlign:"right",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}} title={r.dun}>{r.dun}</div>
                      <div style={{flex:1,height:16,background:"#f1f5f9",borderRadius:3,overflow:"hidden"}}>
                        <div style={{width:(r.count/maxCount*100)+"%",height:"100%",background:DISTRICT_COLOR[r.district]||"#64748b",borderRadius:3,minWidth:r.count>0?2:0}}/>
                      </div>
                      <div style={{width:44,fontSize:11,fontWeight:700,color:r.count===0?"#dc2626":"#334155",textAlign:"right"}}>{r.count}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        };

        return (
          <>
            <div style={{...s.card,padding:"12px 16px",marginBottom:14,fontSize:12,color:"#475569",lineHeight:1.5}}>
              <b>Local gaps by DUN.</b> Completed responses per state constituency (DUN), grouped by district. Use this to spot under-represented areas and re-prompt specific schools. Bars share a common scale across both charts. Zero-count DUNs are flagged in red.
            </div>

            {/* District filter */}
            <div style={{...s.card,padding:"12px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:11,fontWeight:700,color:"#94a3b8",letterSpacing:"0.05em",textTransform:"uppercase"}}>Filter by district</span>
              <select value={dunDistrict} onChange={e=>setDunDistrict(e.target.value)}
                style={{fontSize:12,border:"1px solid "+(dunDistrict!=="All"?"#0e4a6e":"#e2e8f0"),borderRadius:6,padding:"5px 10px",
                  color:dunDistrict!=="All"?"#0e4a6e":"#475569",fontWeight:dunDistrict!=="All"?600:400,cursor:"pointer"}}>
                <option value="All">All districts</option>
                {allDistricts.map(d=><option key={d} value={d}>{d}</option>)}
              </select>
              {dunDistrict!=="All" && <button onClick={()=>setDunDistrict("All")} style={{fontSize:11,color:"#0e4a6e",background:"none",border:"none",cursor:"pointer",textDecoration:"underline",padding:0}}>clear</button>}
            </div>

            {chart("Penang Island DUNs", islandRows, "Timur Laut · Barat Daya")}
            {chart("Seberang Perai (Mainland) DUNs", mainlandRows, "SP Utara · SP Tengah · SP Selatan")}
            {islandRows.length===0 && mainlandRows.length===0 && (
              <div style={{...s.card,padding:20,textAlign:"center",color:"#94a3b8",fontSize:12}}>No DUNs for this filter.</div>
            )}
          </>
        );
      })()}

      {/* ======================= ROLLUP (DOMAIN / OBJECTIVE) ======================= */}
      {page === "rollup" && (() => {
        const rows = data?.questionRows;
        const catalog = data?.surveyQuestions;
        const roLabels = data?.roLabels || {};
        const domainLabels = data?.domainLabels || {};
        const domainOrder = data?.domainOrder || ["OS","TR","HO","SP","RI","CP","CI","HS"];
        if (!rows || !rows.length || !catalog) {
          return <div style={{...s.card,padding:24,textAlign:"center",color:"#94a3b8",fontSize:13}}>No question data yet. Run the pipeline to populate the rollup.</div>;
        }

        const LENS_DEFS = [
          { key:"g", label:"Gender", values:[["Male","Male"],["Female","Female"]] },
          { key:"a", label:"Age", values:[["10-12","10-12"],["13-16","13-16"],["17","17"]] },
          { key:"i", label:"Income", values:[["B40","B40"],["M40","M40"],["T20","T20"]] },
          { key:"u", label:"Urban/Rural", values:[["Urban","Urban"],["Peri-urban","Peri-urban"],["Rural","Rural"]] },
          { key:"d", label:"Disability", values:[["Disabled",1],["Not disabled",0]] },
          { key:"m", label:"Migration", values:[["Migrant/refugee",1],["Citizen",0]] },
          { key:"w", label:"Wellbeing", values:[["Low wellbeing",1],["Not low",0]] },
        ];
        const lensUsed = (key) => filters.find(f => f.key === key);
        const setLensValue = (key, value) => setFilters(prev => {
          const without = prev.filter(f => f.key !== key);
          if (!value) return without;
          if (without.length >= 3 && !prev.find(f=>f.key===key)) return prev;
          return [...without, { key, value }];
        });
        const wbRows = withWellbeing(rows, catalog);
        const filtered = wbRows.filter(r => filters.every(f => String(r[f.key]) === String(f.value)));

        // Build scored items: one per single/multi question, one per matrix row.
        // Each item: {engId, rowIdx?, label, module, domains, ro, favRate, conRate, n}
        const MOD = { parent:"Parent", pregnant:"Pregnant", under10:"Under-10", child:"Child" };
        // When filtering by the wellbeing lens, drop the two questions it's derived
        // from (their result would be circular - always 100% concerning).
        const WB_SOURCE = new Set(["289909905","292468426"]);
        const wbActive = filters.some(f => f.key === "w");
        const items = [];
        for (const engId of Object.keys(catalog)) {
          if (wbActive && WB_SOURCE.has(engId)) continue;
          const q = catalog[engId];
          const sc = scoreQuestion(engId, q.options);
          if (!sc) continue; // DIAG or excluded
          const favSet = new Set(sc.fav), conSet = new Set(sc.con);
          if (q.type === "matrix") {
            (q.rows||[]).forEach((rowLabel, ri) => {
              let fav=0, con=0, n=0;
              for (const r of filtered) {
                const v = r.q?.[engId];
                if (!v || typeof v!=="object" || Array.isArray(v)) continue;
                const col = v[ri];
                if (col==null) continue;
                n++; if (favSet.has(col)) fav++; else if (conSet.has(col)) con++;
              }
              if (n>0) items.push({ engId, rowIdx:ri, label:q.heading+" - "+rowLabel, module:q.module, domains:q.domains||[], ro:q.ro||[], favRate:Math.round(fav/n*100), conRate:Math.round(con/n*100), n });
            });
          } else if (q.type === "multi") {
            let fav=0, con=0, n=0;
            for (const r of filtered) {
              const v = r.q?.[engId];
              if (!Array.isArray(v)) continue;
              n++;
              if (v.some(idx=>favSet.has(idx))) fav++;
              if (v.some(idx=>conSet.has(idx))) con++;
            }
            if (n>0) items.push({ engId, label:q.heading, module:q.module, domains:q.domains||[], ro:q.ro||[], favRate:Math.round(fav/n*100), conRate:Math.round(con/n*100), n });
          } else { // single
            let fav=0, con=0, n=0;
            for (const r of filtered) {
              const v = r.q?.[engId];
              if (typeof v!=="number") continue;
              n++; if (favSet.has(v)) fav++; else if (conSet.has(v)) con++;
            }
            if (n>0) items.push({ engId, label:q.heading, module:q.module, domains:q.domains||[], ro:q.ro||[], favRate:Math.round(fav/n*100), conRate:Math.round(con/n*100), n });
          }
        }

        const isDomain = rollupAxis === "domain";
        const groups = isDomain
          ? domainOrder.map(dc => ({ key:dc, label:domainLabels[dc]||dc, items: items.filter(it => it.domains.includes(dc)) }))
          : Object.keys(roLabels).map(ro => ({ key:ro, label:roLabels[ro], items: items.filter(it => it.ro.map(String).includes(String(ro))) }));

        const itemRow = (it, highlight) => (
          <div key={it.engId+(it.rowIdx??"")} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderTop:"1px solid #f8fafc"}}>
            <div style={{flex:1,minWidth:0,fontSize:11,color:"#334155",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}} title={it.label}>
              {highlight==="fav" && <span style={{color:"#16a34a",fontWeight:700}}>★ </span>}
              {highlight==="con" && <span style={{color:"#dc2626",fontWeight:700}}>▲ </span>}
              {it.label} <span style={{color:"#94a3b8"}}>· {MOD[it.module]||it.module}</span>
            </div>
            <div style={{width:120,display:"flex",gap:4,alignItems:"center"}}>
              <div style={{flex:1,height:12,background:"#f1f5f9",borderRadius:2,display:"flex",overflow:"hidden"}}>
                <div style={{width:it.favRate+"%",height:"100%",background:"#16a34a"}}/>
                <div style={{width:it.conRate+"%",height:"100%",background:"#dc2626",marginLeft:"auto"}}/>
              </div>
            </div>
            <div style={{width:88,fontSize:10,textAlign:"right"}}>
              <span style={{color:"#16a34a",fontWeight:700}}>{it.favRate}%</span>
              <span style={{color:"#94a3b8"}}> / </span>
              <span style={{color:"#dc2626",fontWeight:700}}>{it.conRate}%</span>
            </div>
            <div style={{width:40,fontSize:9,color:it.n<30?"#dc2626":"#94a3b8",textAlign:"right"}}>n={it.n}</div>
          </div>
        );

        return (
          <>
            {/* Filter bar */}
            <div className="cfp-sticky" style={{...s.card,padding:"12px 14px",marginBottom:14,top:8,zIndex:20,boxShadow:"0 2px 8px rgba(15,23,42,0.08)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:8}}>
                <div style={{display:"flex",gap:6}}>
                  {["domain","objective"].map(a=>(
                    <button key={a} onClick={()=>setRollupAxis(a)} style={{
                      padding:"5px 12px",fontSize:12,borderRadius:6,cursor:"pointer",fontWeight:rollupAxis===a?700:400,
                      border:"1px solid "+(rollupAxis===a?"#0e4a6e":"#e2e8f0"),background:rollupAxis===a?"#0e4a6e":"#fff",color:rollupAxis===a?"#fff":"#475569",
                    }}>{a==="domain"?"By AFC Domain":"By Research Objective"}</button>
                  ))}
                </div>
                <span style={{fontSize:11,color:"#64748b"}}>
                  <b style={{color:"#0f172a"}}>{filtered.length.toLocaleString()}</b> of {rows.length.toLocaleString()} responses
                  {filters.length>0 && <button onClick={()=>setFilters([])} style={{marginLeft:8,fontSize:11,color:"#0e4a6e",background:"none",border:"none",cursor:"pointer",textDecoration:"underline",padding:0}}>clear</button>}
                </span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:8}}>
                {LENS_DEFS.map(ld=>{
                  const active = lensUsed(ld.key); const atMax = filters.length>=3 && !active;
                  return (
                    <div key={ld.key}>
                      <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",marginBottom:3}}>{ld.label}</div>
                      <select value={active?active.value:""} disabled={atMax} onChange={e=>setLensValue(ld.key, e.target.value)}
                        style={{fontSize:12,border:"1px solid "+(active?"#0e4a6e":"#e2e8f0"),borderRadius:6,padding:"5px 8px",width:"100%",
                          background:atMax?"#f1f5f9":"#fff",color:active?"#0e4a6e":"#475569",fontWeight:active?600:400,cursor:atMax?"not-allowed":"pointer"}}>
                        <option value="">All</option>
                        {ld.values.map(([label,code])=><option key={String(code)} value={String(code)}>{label}</option>)}
                      </select>
                    </div>
                  );
                })}
              </div>
              <div style={{fontSize:10,color:"#94a3b8",marginTop:6}}>Green = favourable rate · Red = concerning rate. ★ marks each group's strongest positive, ▲ its biggest concern. Diagnostic questions (improvement lists, barriers) are excluded.</div>
            </div>

            {groups.map(g=>{
              if (!g.items.length) return (
                <div key={g.key} style={{marginBottom:14}}>
