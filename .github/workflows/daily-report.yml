name: CFP Daily Survey Report

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours for dashboard data (reduced from 2h to stay under API daily cap)
    - cron: "0 1 * * *"     # 1am UTC / 9am MYT for daily email
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run daily report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SM_MCP_TOKEN:      ${{ secrets.SM_MCP_TOKEN }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
        run: node daily-report.js

      - name: Commit data.json and response cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json response-cache.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update survey data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Another workflow may have pushed while we ran; pull/rebase and retry.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed - retrying after pull/rebase..."
            sleep 5
          done
