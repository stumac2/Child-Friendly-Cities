name: CFP School Participation Extract

# Run on demand only (click "Run workflow" in the Actions tab)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run school extract
        env:
          SM_MCP_TOKEN: ${{ secrets.SM_MCP_TOKEN }}
        run: node school-extract.js

      - name: Commit the extract file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/school-participation.xlsx
          git diff --staged --quiet || git commit -m "School participation extract $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
