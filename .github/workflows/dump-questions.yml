name: CFP Question Structure Dump

# Run on demand only (click "Run workflow" in the Actions tab).
# One-off diagnostic: dumps the English survey's question structure to find the
# disability (Washington Group) questions. Makes a single API call (details only).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run question dump
        env:
          SM_MCP_TOKEN: ${{ secrets.SM_MCP_TOKEN }}
        run: node dump-questions.js

      - name: Commit the dump file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/question-dump.txt
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Question structure dump $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed - retrying after pull/rebase..."
            sleep 5
          done
