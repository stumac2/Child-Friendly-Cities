name: freetext-analysis

on:
  workflow_dispatch: {}
  schedule:
    # Twice weekly (Mon & Thu, 02:00 UTC / 10am MYT) - free-text themes change slowly,
    # and the first run does the expensive full discovery; later runs are cheap incremental.
    - cron: "0 2 * * 1,4"

permissions:
  contents: write

jobs:
  freetext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run free-text analysis
        env:
          SM_MCP_TOKEN: ${{ secrets.SM_MCP_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node freetext-analysis.js

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/freetext-analysis.json freetext-cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            for i in 1 2 3 4 5; do
              git commit -m "Update free-text analysis" && \
              git pull --rebase origin main && \
              git push origin main && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
