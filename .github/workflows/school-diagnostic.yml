name: School Type Diagnostic

# Manual only - read-only pull of Q63 (school name) to test five-way classification.
# Does NOT touch the dashboard or data.json. Produces school-diagnostic.json artifact.
on:
  workflow_dispatch:

jobs:
  school-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run school-type diagnostic
        env:
          SM_MCP_TOKEN: ${{ secrets.SM_MCP_TOKEN }}
        run: node school-diagnostic.js

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: school-diagnostic
          path: school-diagnostic.json
          retention-days: 14
